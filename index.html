  <script>
    var $book = $(".flipbook");
    var RATIO = 600 / 500; // nisbah asal satu muka surat (500 x 600)

    // Telefon / skrin potret: satu muka surat. Tablet landskap / desktop: dua muka.
    function getDisplay() {
      return (window.innerWidth < 768 || window.innerWidth < window.innerHeight) ? "single" : "double";
    }

    function getSize(display) {
      var pages = display === "double" ? 2 : 1;
      var pageW = Math.min(500, (window.innerWidth * 0.96) / pages, (window.innerHeight * 0.94) / RATIO);
      pageW = Math.floor(pageW);
      return { width: pageW * pages, height: Math.floor(pageW * RATIO) };
    }

    var display = getDisplay();
    var size = getSize(display);
    $book.turn({ width: size.width, height: size.height, display: display, autoCenter: true });

    function resizeBook() {
      var d = getDisplay();
      if (d !== $book.turn("display")) $book.turn("display", d);
      var s = getSize(d);
      $book.turn("size", s.width, s.height);
    }

    var timer;
    $(window).on("resize orientationchange load", function () {
      clearTimeout(timer);
      timer = setTimeout(resizeBook, 150);
    });
  </script>
